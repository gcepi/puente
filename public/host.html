<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f6f5c" />
  <title>Puente Host</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main id="setup" class="center">
    <form class="card" id="setupForm">
      <h1 class="brand">Pu<span>e</span>nte</h1>
      <p class="sub">Start a translated meeting</p>
      <label>Translation engine
        <select id="engine"></select>
      </label>
      <p class="small" id="engineNote"></p>
      <label id="passWrap" class="hidden">Host passcode
        <input id="passcode" type="password" autocomplete="current-password" />
      </label>
      <button class="btn" type="submit">Start session</button>
      <p class="err" id="setupErr"></p>
    </form>
  </main>

  <main id="host" class="host hidden">
    <aside class="panel">
      <p class="status" style="text-align:center;margin:0">Team: scan the QR code, or enter</p>
      <p class="room-code" id="roomCode">----</p>
      <div class="qr" id="qr"></div>
      <p class="join-url" id="joinUrl"></p>
      <div class="row">
        <span class="dot" id="dot"></span>
        <span id="who" class="status">0 listening</span>
        <span class="small" id="engineName" style="margin-left:auto"></span>
      </div>

      <button class="mic" id="micBtn">🎙 Start translating</button>
      <div class="meter"><i id="meter"></i></div>

      <div>
        <p class="small" style="margin:0 0 6px">When does the voice speak?</p>
        <div class="seg" id="modes">
          <button data-mode="auto" aria-pressed="true">When I pause</button>
          <button data-mode="ptt" aria-pressed="false">Hold to talk</button>
          <button data-mode="manual" aria-pressed="false">When I tap</button>
        </div>
      </div>
      <button class="ptt hidden" id="pttBtn">Hold to talk <span class="small">(or Space)</span></button>
      <button class="btn secondary hidden" id="flushBtn">Translate now <span class="small">(Enter)</span></button>
      <p class="err" id="hostErr"></p>
      <div class="row">
        <a class="btn secondary" id="transcriptBtn" style="flex:1;text-align:center;text-decoration:none;font-size:15px">Download transcript</a>
        <button class="btn secondary" id="endBtn" style="flex:1;font-size:15px">End meeting</button>
      </div>
    </aside>

    <section class="monitor">
      <div class="col"><div class="label">English · what I said</div><div class="pane en" id="enPane"></div></div>
      <div class="divider"></div>
      <div class="col"><div class="label">Español · what they hear</div><div class="pane es" id="esPane"></div></div>
    </section>
  </main>
  <script type="module" src="/js/host.js"></script>
</body>
</html>
