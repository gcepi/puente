<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#093153" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Puente Host" />
  <title>Puente Host</title>
  <link rel="manifest" href="/host.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="/solo-touch-icon.png" />
  <link rel="icon" href="/icon.svg" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main id="setup" class="center">
    <form class="card" id="setupForm">
      <h1 class="brand">Pu<span>e</span>nte</h1>
      <p class="sub">Hold to talk, let go, and the team hears it in Spanish.</p>
      <label>Mode
        <select id="engine"></select>
      </label>
      <p class="small" id="engineNote"></p>
      <label id="passWrap" class="hidden">Host passcode
        <input id="passcode" type="password" autocomplete="current-password" />
      </label>
      <button class="btn" type="submit">Start session</button>
      <p class="err" id="setupErr"></p>
      <a class="tip" href="/solo">One-on-one on this phone</a>
    </form>
  </main>

  <main id="host" class="host hidden">
    <aside class="panel">
      <p class="status" style="text-align:center;margin:0" lang="es">Escanea el QR para entrar a la reunión</p>
      <div class="qr" id="qr"></div>
      <p class="join-url" id="joinUrl"></p>
      <div class="row">
        <span class="dot" id="dot"></span>
        <span id="who" class="status">0 listening</span>
        <span class="small" id="engineName" style="margin-left:auto"></span>
      </div>

      <button class="ptt" id="pttBtn">
        <span id="pttLabel">Hold to talk</span>
        <span class="small" id="pttHint">Release and the Spanish voice repeats it · or hold Space</span>
      </button>
      <div class="meter"><i id="meter"></i></div>
      <p class="small" id="turnInfo" aria-live="polite"></p>
      <label class="toggle"><input type="checkbox" id="liveToggle" checked /> Live English while I talk (beta)</label>
      <p class="err" id="hostErr"></p>
      <div class="row">
        <a class="btn secondary" id="transcriptBtn" style="flex:1;text-align:center;text-decoration:none;font-size:15px">Download transcript</a>
        <button class="btn secondary" id="endBtn" style="flex:1;font-size:15px">End meeting</button>
      </div>
      <a class="tip" href="/solo" target="_blank" rel="noopener">Open one-on-one in a new tab</a>
    </aside>

    <section class="monitor">
      <div class="size-ctl"><button class="icon-btn" id="monSmaller" title="Smaller text">A−</button><button class="icon-btn" id="monBigger" title="Bigger text">A+</button></div>
      <div class="col"><div class="label">English</div><div class="pane en" id="enPane"></div></div>
      <div class="divider"></div>
      <div class="col"><div class="label">Español</div><div class="pane es" id="esPane"></div></div>
    </section>
  </main>
  <script type="module" src="/js/host.js"></script>
</body>
</html>
